<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-labelledby="t d"><title id="t">Plant cell (leaf cell)</title><desc id="d">A box-shaped plant leaf cell drawn at the same scale as the animal cell. Labels on the right: cell wall, the thick outer line; cell membrane, just inside the wall; cytoplasm, a thin layer at the edges; vacuole (cell sap), the large central space; nucleus, at one side; chloroplasts, small green discs in the cytoplasm.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3"><circle cx="5" cy="5" r="4" fill="#1A2033"/></marker></defs><rect width="900" height="640" fill="#FFFFFF"/>
