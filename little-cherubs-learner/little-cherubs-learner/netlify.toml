[build]
  publish = "public"
  command = "echo 'No build step'"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# The app is a single page. Any unknown path loads the app shell.
[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
