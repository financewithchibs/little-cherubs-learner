<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1080" width="1120" height="1080" role="img" aria-labelledby="t d"><title id="t">Concept map of the nature of Biology</title><desc id="d">A concept map. In the centre, a dark-blue oval reads Biology: the study of living things. Lines labelled studies join it to four boxes: Botany (plants), Zoology (animals), Mycology (fungi) and Genetics (inheritance in all organisms). A smaller box, Entomology (insects), hangs below Zoology, joined by a line labelled is part of. A grey box at the top, joined by is a, reads Science: uses evidence. A grey box at the bottom, joined by helps, reads Health, farming, environment, jobs.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3"><circle cx="5" cy="5" r="4" fill="#1A2033"/></marker></defs><rect width="1120" height="1080" fill="#FFFFFF"/>
