<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1030" width="1000" height="1030" role="img" aria-labelledby="t d">
<title id="t">The scientific inquiry cycle</title>
<desc id="d">Six rounded boxes in a ring joined by thick clockwise arrows: 1 Observation, 2 Identifying a problem, 3 Forming a hypothesis, 4 Testing by experiment, 5 Recording and analysing data, 6 Forming a conclusion. Scientific inquiry is written in the centre. A dashed arrow labelled New question runs from box 6 back to box 1. Two grey boxes branch off box 6: Share findings with peers, and Use findings to solve problems.</desc>
